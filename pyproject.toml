[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m3ta-uitars"
version = "0.1.0"
description = "UI-TARS integration layer for M3ta-0S (Qu3bii, Hermes, Metatron, and related agents)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Eagle Eye Vision Labz" }]
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
m3ta-uitars-server = "m3ta_uitars.server.http_app:main"
m3ta-uitars-mcp = "m3ta_uitars.server.mcp_server:main"
m3ta-uitars-validate = "scripts.validate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
